name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          # Ép build xuất ra thư mục dist chuẩn
          if [ -f "node_modules/.bin/vite" ]; then
            npx vite build
          else
            npm run build
          fi

      - name: Prepare Web Assets for Capacitor
        run: |
          rm -rf www
          mkdir -p www

          if [ -d "dist" ]; then
            cp -r dist/* www/
          elif [ -d "build" ]; then
            cp -r build/* www/
          else
            cp -r *.html *.js *.css *.json public www/ 2>/dev/null || true
          fi

      - name: Setup Capacitor & Build APK
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --save-dev

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.xboxcloud.app",
            "appName": "Xbox Cloud",
            "webDir": "www"
          }
          EOF

          rm -rf android
          npx cap add android
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xbox-cloud-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
