name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: user_source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Capacitor Project from Scratch
        run: |
          cd $GITHUB_WORKSPACE
          mkdir capacitor_app
          cd capacitor_app
          
          # Khởi tạo một dự án Node chuẩn
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          
          # Cấu hình Capacitor
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.xboxcloud.app",
            "appName": "Xbox Cloud",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          
          # Tạo thư mục web gốc
          mkdir www
          
          # Khởi tạo nền tảng Android
          npx cap add android

      - name: Copy User Web Code to Capacitor
        run: |
          cd $GITHUB_WORKSPACE/capacitor_app
          
          # 1. Tìm chính xác đường dẫn chứa file index.html
          INDEX_PATH=$(find ../user_source -name "index.html" | head -n 1)
          
          if [ -n "$INDEX_PATH" ]; then
             # Lấy thư mục chứa file index.html (VD: ../user_source/dist)
             WEB_DIR=$(dirname "$INDEX_PATH")
             echo "Đã tìm thấy Web folder tại: $WEB_DIR"
             
             # Copy toàn bộ nội dung của thư mục đó vào www (bao gồm cả file ẩn)
             cp -a "$WEB_DIR/"* www/
             cp -a "$WEB_DIR/".* www/ 2>/dev/null || true
          else
             echo "Không tìm thấy index.html. Tạo file báo lỗi tạm thời..."
             echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>App</title></head><body><h1>No index.html found in source</h1></body></html>' > www/index.html
             cp -a ../user_source/* www/ 2>/dev/null || true
          fi
          
          # Đồng bộ các plugin (tránh lỗi capacitor.plugins.json)
          npx cap sync android

      - name: Build Android APK
        run: |
          cd $GITHUB_WORKSPACE/capacitor_app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xbox-cloud-app.apk
          path: capacitor_app/android/app/build/outputs/apk/debug/app-debug.apk
