name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Project & Install Dependencies
        run: |
          # 1. Tự động tạo package.json nếu kho chưa có
          if [ ! -f "package.json" ]; then
            echo "Kho chưa có package.json, tự động khởi tạo..."
            npm init -y
          else
            npm install --legacy-peer-deps || true
            npm run build || npx vite build || true
          fi

          # 2. Cài đặt Capacitor
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --save-dev

      - name: Prepare Web Assets for Capacitor
        run: |
          rm -rf www
          mkdir -p www

          # 3. Sao chép toàn bộ mã nguồn web vào thư mục www
          if [ -d "dist" ] && [ "$(ls -A dist)" ]; then
            cp -r dist/* www/
          elif [ -d "build" ] && [ "$(ls -A build)" ]; then
            cp -r build/* www/
          else
            cp -r * www/ 2>/dev/null || true
            rm -rf www/node_modules www/android www/.git www/.github
          fi

          # 4. Tìm tệp index.html nếu nằm trong thư mục con
          if [ ! -f "www/index.html" ]; then
            INDEX_PATH=$(find . -maxdepth 3 -name "index.html" | head -n 1)
            if [ -n "$INDEX_PATH" ]; then
              cp "$INDEX_PATH" www/index.html
            fi
          fi

      - name: Setup Capacitor & Build APK
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.xboxcloud.app",
            "appName": "Xbox Cloud",
            "webDir": "www"
          }
          EOF

          rm -rf android
          npx cap add android
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xbox-cloud-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
