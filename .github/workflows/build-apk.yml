name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Cho phép bạn bấm nút Build thủ công trên GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Tải mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt môi trường Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Cấp quyền thực thi cho Gradle
      run: chmod +x gradlew

    - name: Xuất file APK (Debug)
      run: ./gradlew assembleDebug

    - name: Tải APK lên GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
