name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies & Build
        run: |
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps
            npm run build --if-present
          fi

      - name: Setup Capacitor Configuration
        run: |
          WEB_DIR="."
          if [ -d "dist" ]; then WEB_DIR="dist";
          elif [ -d "build" ]; then WEB_DIR="build";
          elif [ -d "public" ]; then WEB_DIR="public";
          fi

          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.xboxcloud.app",
            "appName": "Xbox Cloud",
            "webDir": "$WEB_DIR",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android Platform & Sync
        run: |
          npx cap add android
          npx cap copy android

      - name: Build APK File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xbox-cloud-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
