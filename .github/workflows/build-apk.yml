name: Build APK for Community

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Tải mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Khởi tạo Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Xuất file APK (Dùng Gradle hệ thống)
      run: gradle assembleDebug

    - name: Tải APK lên GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Xbox-Cloud-Gaming-APK
        path: app/build/outputs/apk/debug/*.apk
