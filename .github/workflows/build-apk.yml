name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Web Assets & Capacitor
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

          if grep -q '"build":' package.json 2>/dev/null; then
            npm install --legacy-peer-deps || true
            npm run build || true
          fi

          WEB_DIR="www"
          mkdir -p www

          if [ -d "dist" ]; then WEB_DIR="dist";
          elif [ -d "build" ]; then WEB_DIR="build";
          else
            cp -r *.html *.js *.css *.json www/ 2>/dev/null || true
          fi

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.xboxcloud.app",
            "appName": "Xbox Cloud",
            "webDir": "$WEB_DIR"
          }
          EOF

      - name: Add Android & Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build APK File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xbox-cloud-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
