name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install & Build Web App
        run: |
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps || true
            npm run build || npx vite build || true
          fi

      - name: Prepare Web Assets for Capacitor
        run: |
          rm -rf www
          mkdir -p www

          # Kiểm tra và sao chép index.html vào thư mục www
          if [ -f "dist/index.html" ]; then
            cp -r dist/* www/
          elif [ -f "build/index.html" ]; then
            cp -r build/* www/
          elif [ -f "index.html" ]; then
            cp -r index.html *.js *.css *.json public src www/ 2>/dev/null || true
          fi

          # Tạo tệp index.html dự phòng nếu chưa có để đảm bảo Capacitor không bị lỗi
          if [ ! -f "www/index.html" ]; then
            echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Xbox Cloud</title></head><body><div id="root"></div></body></html>' > www/index.html
          fi

      - name: Setup Capacitor & Sync Android
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --save-dev

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.xboxcloud.app",
            "appName": "Xbox Cloud",
            "webDir": "www"
          }
          EOF

          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build APK File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xbox-cloud-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
