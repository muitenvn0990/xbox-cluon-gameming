name: Xbox cloud game 

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies & Build project
        run: |
          npm install
          npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Capacitor & Convert Web to Android App
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          BUILD_DIR="dist"
          if [ -d "build" ]; then BUILD_DIR="build"; fi
          npx cap init "Xbox Cloud" "com.xboxcloud.app" --web-dir $BUILD_DIR
          npx cap add android
          npx cap copy android

      - name: Build APK file
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: xbox-cloud-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
